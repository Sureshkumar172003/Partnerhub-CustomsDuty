<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail View &mdash; PartnerHub</title>
    
    <link rel="stylesheet" href="css/slds.css">
    
    <!-- Ag-Grid Scripts & Styles -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.noStyle.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Neutralizing slds.css gaps */
        .slds-body, .slds-body--no-tabs { 
            margin-left: 0 !important; width: 100% !important; max-width: 100% !important; padding-top: 0 !important; 
        }
        .slds-content-lg { padding: 12px 16px !important; }

        /* Ag-Grid Custom Styling (Matching Transaction Grid Page) */
        .ag-theme-alpine { 
            --ag-header-background-color: #f8fafc; 
            --ag-font-family: 'Montserrat'; 
            width: 100% !important; 
            height: 400px !important; 
            border: 1px solid #e2e8f0;
        }
        .ag-theme-alpine .ag-header-cell { border-right: 1px solid #e2e8f0 !important; }
        .ag-theme-alpine .ag-header-cell-label { 
            font-weight: 800 !important; 
            color: #1e293b !important;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .ag-theme-alpine .ag-row { border-bottom: 1px solid #f1f5f9; }
        .ag-theme-alpine .ag-cell { display: flex; align-items: center; font-size: 13px; color: #334155; }

        /* Minimizable Card Styling */
        .summary-header {
            display: flex; color: #ea580c; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: #fff; cursor: pointer;
            border: 1px solid #DDDBDA; border-bottom: none; border-radius: 4px 4px 0 0;
            user-select: none;
        }
        .summary-header span {
    color: #ea580c !important;
    font-weight: 800;
    letter-spacing: 0.5px;
    position: relative;
    font-size: 11px;
    text-transform: uppercase;
}
.summary-header:hover .rotate-icon {
    color: #ea580c;
    transform: scale(1.1);
}
        #metaCardBody { transition: max-height 0.3s ease-out; overflow: hidden; background: #fff; border: 1px solid #DDDBDA; }
        #metaCardBody.collapsed { max-height: 0 !important; padding: 0 !important; border: none !important; }
        .rotate-icon {
    color: #f97316 !important;
    font-size: 14px;
    transition: transform 0.3s, color 0.2s;
}
.summary-header:hover .rotate-icon {
    color: #ea580c !important;
    transform: scale(1.1);
}
        .collapsed-icon {
    transform: rotate(-90deg);
    color: #f97316 !important;
}

        /* Bottom Action Bar */
        .bottom-action-bar {
            display: flex; align-items: center; gap: 10px; padding: 12px 16px; 
            background: #fff; border: 1px solid #DDDBDA; border-top: none;
            border-radius: 0 0 4px 4px; margin-bottom: 20px;
        }

        .hidden { display: none; }
        .edit-mode-active { border: 2px solid var(--slds-brand-accent) !important; }

        body.in-iframe { padding: 0 !important; margin: 0 !important; background: #f8fafc; }
        body.in-iframe #slds-global-header-container, 
        body.in-iframe #slds-app-nav-container, 
        body.in-iframe #slds-workspace-tabs-container { display: none !important; }
    </style>
</head>
<body>
    <div class="slds-body">
        <!-- Header -->
        <div class="slds-list-header">
            <div class="slds-list-header__icon-title">
                <div class="slds-icon-std ic-report" style="background:var(--slds-brand);">
                    <svg fill="none" stroke="white" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div>
                    <div class="slds-list-title">Customs Duty Control</div>
                    <div class="slds-list-subtitle">DETAIL VIEW</div>
                </div>
            </div>
        </div>

        <div class="slds-content-lg">
            
            <!-- Minimizable Transaction Summary -->
            <div class="summary-header" onclick="toggleMetaCard()">
    <span>Transaction Summary</span>
    <i id="foldArrow" class="fa-solid fa-chevron-down rotate-icon"></i>
</div>
            <div id="metaCardBody" style="padding:20px; font-size: 12px; color: #444;">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-x-12 gap-y-4">
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Ref #</p><p id="refNo" class="font-bold text-blue-600 underline"></p></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Upload name</p><p id="uploadNameDisplay" class="font-bold"></p></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Type</p><span id="typeBadge" class="slds-badge slds-badge-info"></span></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Status</p><div id="statusBox"></div></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Store</p><p id="storeDisplay" class="font-bold"></p></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Lines</p><p id="lineInfo" class="font-bold"></p></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Uploaded</p><p id="uploadedAtDisplay" class="font-bold text-slate-500"></p></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Last update</p><p id="lastUpdateDisplay" class="font-bold text-slate-500"></p></div>
                </div>
            </div>

            <!-- The Grid -->
            <div id="detailAg" class="ag-theme-alpine"></div>

            <!-- Bottom Action Bar -->
            <div class="bottom-action-bar">
                <button class="slds-btn slds-btn-neutral slds-btn-sm" onclick="enableEditMode()">
                    <i class="fa-solid fa-pen-to-square mr-1"></i> Update file
                </button>
                <button class="slds-btn slds-btn-neutral slds-btn-sm slds-text-color_error" onclick="deleteSelectedLines()">
                    <i class="fa-solid fa-trash-can mr-1"></i> Delete Transaction
                </button>

                <!-- SAVE BUTTONS: Only visible when editing -->
                <div id="saveContainer" class="hidden ml-auto flex gap-2">
                    <button class="slds-btn slds-btn-neutral slds-btn-sm px-6" onclick="cancelUpdate()">Cancel</button>
                    <button class="slds-btn slds-btn-brand slds-btn-sm px-8" onclick="processSave()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let detApi;
        let isEditMode = false;
        const selected = JSON.parse(localStorage.getItem("selectedRow"));
        const inIframe = (window.self !== window.top);

        if (inIframe) document.body.classList.add('in-iframe');

        window.onload = () => {
            if (!selected) { 
                if(!inIframe) window.location.href = "duty-grid.html"; 
                return; 
            }
            if (localStorage.getItem("save_success_flag") === "true") {
                showToast("Changes saved successfully", "success");
                localStorage.removeItem("save_success_flag");
            }
            loadAndRender();
        };

        function toggleMetaCard() {
            const body = document.getElementById('metaCardBody');
            const arrow = document.getElementById('foldArrow');
            body.classList.toggle('collapsed');
            arrow.classList.toggle('collapsed-icon');
            setTimeout(() => detApi.sizeColumnsToFit(), 300);
        }

        function loadAndRender() {
            const allLines = JSON.parse(localStorage.getItem("uploadedData")) || [];
            const detailRows = allLines.filter(r => String(r.REF).trim() === String(selected.REF).trim());

            // MESSAGE LOGIC: Populate status and message based on data validity
            detailRows.forEach(r => {
                let errors = [];
                if (!r.SKU) errors.push("SKU required");
                if (!r.Qty || Number(r.Qty) === 0) errors.push("Qty cannot be zero");
                
                r.STATUS = errors.length > 0 ? "ERROR" : "VALID";
                r.MESSAGE = errors.length > 0 ? errors.join(", ") : "";
            });

            const errorCount = detailRows.filter(r => r.STATUS === "ERROR").length;

            // Summary Info
            document.getElementById("refNo").innerText = selected.REF;
            document.getElementById("uploadNameDisplay").innerText = selected.uploadName || "N/A";
            document.getElementById("typeBadge").innerText = (selected.type || "Sales").toUpperCase();
            document.getElementById("storeDisplay").innerText = selected.store || "N/A";
            document.getElementById("uploadedAtDisplay").innerText = selected.uploadedAt ? selected.uploadedAt.split('T')[0] : "";
            document.getElementById("lineInfo").innerHTML = `${detailRows.length} (<span style="color: #BA0517; font-weight: 700;">${errorCount} error${errorCount !== 1 ? 's' : ''}</span>)`;
            document.getElementById("lastUpdateDisplay").innerText = selected.lastUpdate || "Not updated yet";
            document.getElementById("statusBox").innerHTML = errorCount > 0 
                ? '<span class="slds-badge slds-badge-error">Validation Error</span>' 
                : '<span class="slds-badge slds-badge-success">Valid</span>';

            const colDefs = [
                { checkboxSelection: true, width: 45, headerCheckboxSelection: true },
                { headerName: 'LINE', valueGetter: "node.rowIndex + 1", width: 80 },
                { headerName: 'STORE CODE', field: 'StoreCode', width: 140, editable: () => isEditMode },
                { headerName: 'STORE NAME', field: 'StoreName', width: 140, editable: () => isEditMode },
                { headerName: 'SALE DATE', field: 'SaleDate', width: 120, editable: () => isEditMode },
                { headerName: 'SKU', field: 'SKU', width: 110, editable: () => isEditMode },
                { headerName: 'DESCRIPTION', field: 'Description', width: 150, editable: () => isEditMode },
                { headerName: 'QTY', field: 'Qty', width: 80, editable: () => isEditMode },
                { headerName: 'UNIT PRICE', field: 'UnitPrice', width: 130, editable: () => isEditMode },
                { headerName: 'TOTAL PRICE', field: 'TotalPrice', width: 140 },
                { headerName: 'STATUS', field: 'STATUS', width: 100, cellRenderer: p => {
                    const color = p.value === 'ERROR' ? '#BA0517' : '#0176D3';
                    const bg = p.value === 'ERROR' ? '#FFE9E9' : '#E3F3FF';
                    return `<span style="background:${bg}; color:${color}; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:700;">${p.value}</span>`;
                }},
                { headerName: 'MESSAGE', field: 'MESSAGE', flex: 1.2 }
            ];

            const gridOptions = {
                columnDefs: colDefs,
                rowData: detailRows,
                rowSelection: 'multiple',
                defaultColDef: { resizable: true, sortable: true },
                getRowStyle: p => (p.data.STATUS === "ERROR") ? { background: '#FEDAD0' } : null,
                onGridReady: (params) => {
                    detApi = params.api;
                    params.api.sizeColumnsToFit();
                }
            };

            detApi = agGrid.createGrid(document.querySelector('#detailAg'), gridOptions);
        }

        function enableEditMode() {
            isEditMode = true;
            document.getElementById('saveContainer').classList.remove('hidden');
            document.getElementById('detailAg').style.border = "2px solid var(--slds-brand-accent)";
            detApi.refreshCells(); 
            showToast("Edit Mode Enabled", "info");
        }

        function cancelUpdate() { window.location.reload(); }

        function processSave() {
            detApi.stopEditing();

            // 1. Collect data from current Grid
            let updatedGridRows = [];
            detApi.forEachNode(node => {
                let row = node.data;
                row.REF = selected.REF; // Ensure reference stays consistent
                updatedGridRows.push(row);
            });

            // 2. Update 'uploadedData' (Individual line items)
            let allLines = JSON.parse(localStorage.getItem("uploadedData")) || [];
            const otherData = allLines.filter(l => String(l.REF).trim() !== String(selected.REF).trim());
            localStorage.setItem("uploadedData", JSON.stringify([...otherData, ...updatedGridRows]));

            // 3. Update 'transactions' (The master grid view)
            const timestamp = new Date().toLocaleString([], { hour: '2-digit', minute: '2-digit', hour12: true });
            let transactions = JSON.parse(localStorage.getItem("transactions")) || [];
            
            transactions.forEach(t => {
                if (String(t.REF).trim() === String(selected.REF).trim()) {
                    t.lines = updatedGridRows.length;
                    const hasErrors = updatedGridRows.some(l => !l.SKU || !l.Qty || Number(l.Qty) === 0);
                    t.status = hasErrors ? "ERROR" : "UPLOADED";
                    t.lastUpdate = timestamp; 
                }
            });

            localStorage.setItem("transactions", JSON.stringify(transactions));
            
            // 4. Update the 'selectedRow' so header info stays fresh on reload
            selected.lastUpdate = timestamp;
            localStorage.setItem("selectedRow", JSON.stringify(selected));
            
            localStorage.setItem("save_success_flag", "true");
            window.location.reload();
        }

        function deleteSelectedLines() {
            const selectedRows = detApi.getSelectedRows();
            if (selectedRows.length === 0) return showToast("Select rows to delete", "warning");
            
            if (confirm(`Delete ${selectedRows.length} selected lines?`)) {
                // Remove from Grid View
                detApi.applyTransaction({ remove: selectedRows });
                // Trigger Save logic to sync with LocalStorage
                processSave();
            }
        }

    </script>
</body>
</html>

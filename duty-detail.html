<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail View &mdash; PartnerHub</title>
    
    <link rel="stylesheet" href="css/slds.css">
    
    <!-- Ag-Grid Scripts & Styles -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.noStyle.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        .ag-theme-alpine { --ag-header-background-color: #ffffff; --ag-font-family: 'Montserrat'; width: 100%; height: 400px; }
        .duty-tabs { border-bottom: 1px solid var(--slds-n7); display: flex; gap: 30px; padding: 0 24px; background: white; }
        .duty-tab-item { padding: 12px 0; font-size: 11px; font-weight: 700; color: var(--slds-n4); text-transform: uppercase; border-bottom: 3px solid transparent; cursor: pointer; text-decoration: none; }
        .duty-tab-item.active { color: var(--slds-brand-accent); border-bottom-color: var(--slds-brand-accent); }
        
        .hidden { display: none; }
        .edit-mode-active { border: 2px solid var(--slds-brand-accent) !important; }
    </style>
</head>
<body>
    <div id="slds-global-header-container"></div>
    <div id="slds-app-nav-container"></div>
    <div id="slds-workspace-tabs-container"></div>

    <div class="slds-body">
        <!-- Header -->
        <div class="slds-list-header">
            <div class="slds-list-header__icon-title">
                <div class="slds-icon-std ic-report" style="background:var(--slds-brand);">
                    <svg fill="none" stroke="white" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div><div class="slds-list-title">Customs Duty Control</div><div class="slds-list-subtitle">DETAIL VIEW</div></div>
            </div>
        </div>

        <div class="duty-tabs">
            <a href="duty-upload.html" class="duty-tab-item">Upload</a>
            <a href="duty-grid.html" class="duty-tab-item">Transaction grid</a>
            <a href="duty-detail.html" class="duty-tab-item active">Detail view</a>
        </div>

        <div class="slds-content-lg">
            <!-- Main Button Bar -->
            <div style="margin-bottom: 16px; display:flex; gap:10px; flex-wrap: wrap;">
                
                <!-- Clicking these enables editing -->
                <button class="slds-btn slds-btn-neutral slds-btn-sm" onclick="enableEditMode()">Update file</button>
                
                <button class="slds-btn slds-btn-neutral slds-btn-sm slds-text-color_error" onclick="deleteSelectedLines()">Delete Transaction</button>

                
                <button class="slds-btn slds-btn-neutral slds-btn-sm ml-auto" onclick="location.href='duty-grid.html'">Back to grid</button>
            </div>

            <!-- Meta Information Card -->
            <div class="slds-card" style="margin-bottom: 16px; padding:20px; font-size: 12px; color: #444;">
    <div class="grid grid-cols-3 gap-x-12 gap-y-4">
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Ref #</p>
            <p id="refNo" class="font-bold text-blue-600 underline"></p>
        </div>
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Upload name</p>
            <p id="uploadNameDisplay" class="font-bold"></p>
        </div>
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Type</p>
            <span id="typeBadge" class="slds-badge slds-badge-info"></span>
        </div>
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Store</p>
            <p id="storeDisplay" class="font-bold"></p>
        </div>
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Status</p>
            <div id="statusBox"></div>
        </div>
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Lines</p>
            <p id="lineInfo" class="font-bold"></p>
        </div>
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Uploaded</p>
            <p id="uploadedAtDisplay" class="font-bold text-slate-500"></p>
        </div>
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Last update</p>
            <p id="lastUpdateDisplay" class="font-bold text-slate-500"></p>
        </div>
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Priority</p>
            <p id="priorityDisplay" class="font-bold"></p>
        </div>
    </div>
</div>

            <!-- The Grid -->
            <div id="detailAg" class="ag-theme-alpine"></div>

            <!-- SAVE BUTTON: Only visible when editing -->
            <div id="saveContainer" class="hidden" style="margin-top: 20px; justify-content: flex-end;">
                <button class="slds-btn slds-btn-neutral px-8 h-10 shadow-sm" onclick="cancelUpdate()">Cancel</button>
                <button class="slds-btn slds-btn-brand px-12 h-10 shadow-lg" onclick="processSave()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
let detApi;
let isEditMode = false;
const selected = JSON.parse(localStorage.getItem("selectedRow"));

window.onload = () => {
    initPage('duty-detail', 'Detail View');
    
    if (!selected) { 
        window.location.href = "duty-grid.html"; 
        return; 
    }

    if (localStorage.getItem("save_success_flag") === "true") {
        showToast("Transaction updated and saved successfully", "success");
        localStorage.removeItem("save_success_flag");
    }

    loadAndRender();
};

function loadAndRender() {
    const allLines = JSON.parse(localStorage.getItem("uploadedData")) || [];
    const detailRows = allLines.filter(r => String(r.REF).trim() === String(selected.REF).trim());

    detailRows.forEach(r => {
    let errorMsgs = [];
    if (!r.SKU) errorMsgs.push("SKU required");
    if (Number(r.Qty) === 0 || !r.Qty) errorMsgs.push("Qty cannot be zero");

    if (errorMsgs.length > 0) {
        r.STATUS = "ERROR";
        r.MESSAGE = errorMsgs.join(", ");
    } else {
        r.STATUS = "VALID";
        r.MESSAGE = "";
    }
});

    const errorCount = detailRows.filter(r => r.STATUS === "ERROR").length;
    document.getElementById("refNo").innerText = selected.REF;
    document.getElementById("uploadNameDisplay").innerText = selected.uploadName || "N/A";
    document.getElementById("typeBadge").innerText = (selected.type || "Sales").toUpperCase();
    document.getElementById("storeDisplay").innerText = selected.store || "N/A";
    document.getElementById("priorityDisplay").innerText = selected.priority || "Normal";
    document.getElementById("uploadedAtDisplay").innerText = selected.uploadedAt ? selected.uploadedAt.split('T')[0] : "";
    document.getElementById("lineInfo").innerText = `${detailRows.length} (${errorCount} errors)`;
    document.getElementById("lastUpdateDisplay").innerText = selected.lastUpdate || "Not updated yet";
    document.getElementById("statusBox").innerHTML = errorCount > 0 
        ? '<span class="slds-badge slds-badge-error">Validation error</span>' 
        : '<span class="slds-badge slds-badge-success">Valid</span>';

    const colDefs = [
    { checkboxSelection: true, width: 50 },
    { headerName: 'LINE', valueGetter: "node.rowIndex + 1", width: 70 },
    { headerName: 'STORE CODE', field: 'StoreCode', width: 120, editable: () => isEditMode, onCellValueChanged: markAsUpdated },
    { headerName: 'STORE NAME', field: 'StoreName', width: 120, editable: () => isEditMode, onCellValueChanged: markAsUpdated },
    { headerName: 'SALE DATE', field: 'SaleDate', width: 120, editable: () => isEditMode, onCellValueChanged: markAsUpdated },
    { headerName: 'SKU', field: 'SKU', flex: 1, editable: () => isEditMode, onCellValueChanged: markAsUpdated },
    { headerName: 'DESCRIPTION', field: 'Description', flex: 1, editable: () => isEditMode, onCellValueChanged: markAsUpdated },
    { headerName: 'QTY', field: 'Qty', width: 100, editable: () => isEditMode, onCellValueChanged: markAsUpdated },
    { headerName: 'UNIT PRICE', field: 'UnitPrice', width: 120, editable: () => isEditMode, onCellValueChanged: markAsUpdated },
    { headerName: 'TOTAL PRICE', field: 'TotalPrice', width: 120, editable: () => isEditMode, onCellValueChanged: markAsUpdated },
    { headerName: 'MODE', field: 'Mode', width: 100, editable: () => isEditMode, onCellValueChanged: markAsUpdated },
    { headerName: 'STATUS', field: 'STATUS', width: 110 },
    { headerName: 'MESSAGE', field: 'MESSAGE', flex: 1 }
];

   function markAsUpdated(params) {
    if (params.data.Mode !== "UPDATE") {
        params.data.Mode = "UPDATE";
        params.api.refreshCells({ rowNodes: [params.node], columns: ['Mode'] });
    }
}

    if (detApi) {
        detApi.setGridOption('rowData', detailRows);
    } else {
        detApi = agGrid.createGrid(document.querySelector('#detailAg'), {
            columnDefs: colDefs,
            rowData: detailRows,
            rowSelection: 'multiple',
            getRowStyle: p => (p.data.STATUS === "ERROR") ? { background: '#FEDAD0' } : null
        });
    }
    setTimeout(() => detApi.sizeColumnsToFit(), 100);
}

function enableEditMode() {
    isEditMode = true;
    document.getElementById('saveContainer').classList.remove('hidden');
    document.getElementById('detailAg').style.border = "2px solid var(--slds-brand-accent)";
    detApi.refreshCells(); 
    showToast("Update Mode Active", "info");
}

function cancelUpdate() {
    window.location.reload();
}

function processSave() {
    detApi.stopEditing();

    let allLines = JSON.parse(localStorage.getItem("uploadedData")) || [];
    let updatedGridRows = [];
    
    detApi.forEachNode(node => {
        let row = node.data;
        row.REF = selected.REF; 
        updatedGridRows.push(row);
    });

    const otherData = allLines.filter(l => String(l.REF).trim() !== String(selected.REF).trim());
    localStorage.setItem("uploadedData", JSON.stringify([...otherData, ...updatedGridRows]));

    const timestamp = new Date().toLocaleString([], { hour: '2-digit', minute: '2-digit', hour12: true });
    
    let transactions = JSON.parse(localStorage.getItem("transactions")) || [];
    transactions.forEach(t => {
        if (String(t.REF).trim() === String(selected.REF).trim()) {
            t.lines = updatedGridRows.length;
    
            const currentlyHasErrors = updatedGridRows.some(l => {
                const q = Number(l.Qty);
                return !l.SKU || q === 0 || isNaN(q);
            });
            
            t.status = currentlyHasErrors ? "ERROR" : "UPLOADED";
            t.lastUpdate = timestamp; 
        }
    });
    localStorage.setItem("transactions", JSON.stringify(transactions));
    selected.lastUpdate = timestamp;
    localStorage.setItem("selectedRow", JSON.stringify(selected));
    localStorage.setItem("save_success_flag", "true");
    window.location.reload();
}

function deleteSelectedLines() {
    const selectedRows = detApi.getSelectedRows();
    if (selectedRows.length === 0) {
        showToast("Please select lines to delete", "warning");
        return;
    }

    if (confirm(`Delete ${selectedRows.length} selected lines?`)) {
        // Remove from Grid first
        detApi.applyTransaction({ remove: selectedRows });
        // Save current clean state of Grid to LocalStorage
        processSave();
    }
}

// Redirect back to grid properly
function backToGrid() {
    window.location.href = "duty-grid.html";
}
</script>
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Upload &mdash; PartnerHub</title>
    <link rel="stylesheet" href="css/slds.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .duty-tabs { border-bottom: 1px solid var(--slds-n7); display: flex; gap: 30px; padding: 0 24px; background: white; }
        .duty-tab-item { padding: 12px 0; font-size: 11px; font-weight: 700; color: var(--slds-n4); text-transform: uppercase; border-bottom: 3px solid transparent; cursor: pointer; text-decoration: none; }
        .duty-tab-item.active { color: var(--slds-brand-accent); border-bottom-color: var(--slds-brand-accent); }
        .file-drop-zone { border: 2px dashed var(--slds-n7); border-radius: 6px; padding: 30px; text-align: center; cursor: pointer; background: var(--slds-n10); transition: 0.2s; }
        .file-drop-zone:hover { border-color: var(--slds-brand); background: #f0f7ff; }
        .form-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 20px; }
        .smart-radio {
    cursor: pointer;
    margin: 0;
}

.smart-radio input[type="radio"] {
    display: none;
}

.smart-radio-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    color: #4b5563;
    transition: all 0.2s;
    cursor: pointer;
}

.smart-radio-label i {
    font-size: 12px;
    color: #6b7280;
}

.smart-radio:hover .smart-radio-label {
    background: #e5e7eb;
    border-color: #d1d5db;
}

.smart-radio input[type="radio"]:checked + .smart-radio-label {
    background: #0176d3;
    border-color: #0176d3;
    color: white;
}

.smart-radio input[type="radio"]:checked + .smart-radio-label i {
    color: white;
}
    </style>
</head>
<body>
    <div id="slds-global-header-container"></div>
    <div id="slds-app-nav-container"></div>
    <div id="slds-workspace-tabs-container"></div>

    <div class="slds-body">
        <div class="slds-list-header">
            <div class="slds-list-header__icon-title">
                <div class="slds-icon-std ic-product"><svg fill="none" stroke="white" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                <div>
                    <div class="slds-list-title">Customs Duty Control</div>
                    <div class="slds-list-subtitle">UPLOAD SCREEN</div>
                </div>
            </div>
            
        </div>

        <div class="duty-tabs">
            <a href="duty-upload.html" class="duty-tab-item active">Upload</a>
            <a href="duty-grid.html" class="duty-tab-item">Transaction grid</a>
            <a href="duty-detail.html" class="duty-tab-item">Detail view</a>
        </div>

        <div class="slds-content-lg">
            <div class="slds-card" style="padding: 24px; margin: 0;">
                <h3 class="slds-form-section-title" style="margin-top:0;">UPLOAD DETAILS</h3>
                <div class="form-row">
                    <div class="slds-form-element">
                        <label class="slds-form-label">UPLOAD NAME<span style="color:red;">*</span></label>
                        <input id="uploadName" class="slds-input" type="text" value="Weekly batch - STR01">
                    </div>
                <div class="slds-form-element">
    <label class="slds-form-label">TYPE<span style="color:red;">*</span></label>
    <div style="display: flex; gap: 12px; margin-top: 6px;">
        <label class="smart-radio">
            <input type="radio" name="orderType" value="Sales order" checked>
            <span class="smart-radio-label">
                <i class="fas fa-shopping-cart"></i> Sales
            </span>
        </label>
        <label class="smart-radio">
            <input type="radio" name="orderType" value="Return order">
            <span class="smart-radio-label">
                <i class="fas fa-undo-alt"></i> Return
            </span>
        </label>
    </div>
</div>
                <div class="slds-form-element">
                    <label class="slds-form-label">STORE<span style="color:red;">*</span></label>
                        <select id="storeSelect" class="slds-select">
                        <option value="">Select Store</option>
                        <option value="STR-001">STR-001</option>
                        <option value="STR-002">STR-002</option>
                        <option value="STR-003">STR-003</option>
                        <option value="STR-004">STR-004</option>
                        </select>
                </div>
                </div>
                <div class="slds-form-element">
                    <label class="slds-form-label">NOTES</label>
                    <textarea class="slds-textarea" placeholder="Optional remarks"></textarea>
                </div>

                <div style="margin-bottom:10px;">
                    <a href="#" onclick="downloadUploadedFile()" class="slds-text-link" style="font-weight:600;">
                        ⬇ Download Excel Format
                    </a>
                </div>
                
                <div class="file-drop-zone" 
                    id="dropZone"
                    onclick="document.getElementById('fInp').click()"
                    ondragover="event.preventDefault(); this.style.borderColor='#0176d3'; this.style.backgroundColor='#f0f7ff';"
                    ondragleave="this.style.borderColor='var(--slds-n7)'; this.style.backgroundColor='var(--slds-n10)';"
                    ondrop="handleDrop(event)">
    
                    <input type="file" id="fInp" style="display:none;" onchange="handleFile(event)">

                    <div style="color:var(--slds-n4); margin-bottom: 10px;">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 20px; color: var(--slds-brand);"></i>
                    </div>
    
                    <div id="fileNameText" style="font-weight:500; color:var(--slds-n3);">
                        Drag & drop files here or <span class="slds-text-link" style="text-decoration: underline;">browse</span>
                    </div>
                    <div style="font-size: 10px; color: var(--slds-n5); margin-top: 5px;">
                        Accepted: .csv, .xlsx • Max 10MB
                    </div>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
                    <button class="slds-btn slds-btn-brand" style="padding: 0 24px;" onclick="submitData()">Submit</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script>initPage('duty-upload', 'Customs Duty Control');</script>
    <script>
let parsedData = []; 
let hasValidationError = false;

function resetFileInput() {
    document.getElementById("fInp").value = "";
    document.getElementById("fileNameText").innerHTML =
        `Drag & drop files here or <span class="slds-text-link" style="text-decoration: underline;">browse</span>`;
    window.uploadedFile = null;
}

function handleFile(event) {
    const file = event.target ? event.target.files[0] : event[0];
    if (!file) return;

    const allowedTypes = ['csv', 'xlsx'];
    const fileName = file.name.toLowerCase();
    const fileExt = fileName.split('.').pop();

    if (!allowedTypes.includes(fileExt)) {
        showToast("Only CSV and XLSX files are allowed", "error");
        parsedData = [];
        document.getElementById("fInp").value = "";
        document.getElementById("fileNameText").innerHTML =
            `Drag & drop files here or <span class="slds-text-link">browse</span>`;
        return;
    }

    window.uploadedFile = file;

    // Show file name
    document.getElementById("fileNameText").innerHTML = `Selected: <strong>${file.name}</strong>`;

    const reader = new FileReader();

reader.onload = function(e) {
    let rows = [];

    // ✅ CSV handling
    if (fileExt === 'csv') {
        const text = e.target.result;
        rows = text.split("\n").map(r => r.trim()).filter(r => r).map(r => r.split(","));
    }

    // ✅ XLSX handling
    else if (fileExt === 'xlsx') {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" })
    .map(r => r.map(c => String(c).trim()));
    }

    if (rows.length === 0) {
        showToast("File is empty or invalid", "error");
        hasValidationError = true;
        resetFileInput();
        return;
    }

    const headers = rows[0];

    const requiredHeaders = [
        'Store Code',
        'Store Name',
        'Sale Date',
        'Item SKU',
        'Item Description',
        'Qty',
        'Unit Price',
        'Total Price',
        'Mode'
    ];

    const normalizedHeaders = headers.map(h => String(h).trim().toLowerCase());

    const isValid = requiredHeaders.every(req =>
        normalizedHeaders.includes(req.toLowerCase())
    );

    if (!isValid) {
        showToast("Invalid file format. Required columns missing.", "error");
        parsedData = [];
        hasValidationError = true;
        resetFileInput();
        return;
    }

    parsedData = rows.slice(1).map(row => {
        let obj = {};
        headers.forEach((h, i) => {
            let key = String(h).trim().toLowerCase();

            if (key === 'store code') key = 'StoreCode';
            else if (key === 'store name') key = 'StoreName';
            else if (key === 'sale date') key = 'SaleDate';
            else if (key === 'item sku') key = 'SKU';
            else if (key === 'item description') key = 'Description';
            else if (key === 'qty') key = 'Qty';
            else if (key === 'unit price') key = 'UnitPrice';
            else if (key === 'total price') key = 'TotalPrice';

            obj[key] = row[i];
        });
        return obj;
    });

    hasValidationError = false;


const normalize = val => String(val || "")
    .replace(/[^a-zA-Z0-9]/g, "")
    .toUpperCase();

const selectedStore = normalize(document.getElementById("storeSelect").value);
if (!selectedStore) {
    showToast("Please select Store before uploading file", "error");
    hasValidationError = true;
    resetFileInput();
    return;
}

const fileStores = parsedData
    .map(r => normalize(r.StoreCode))
    .filter(code => code !== ""); 

const uniqueStores = [...new Set(fileStores)];

if (uniqueStores.length > 1) {
    showToast("Multiple Store Codes found in file. Only one store allowed.", "error");
    parsedData = [];
    hasValidationError = true;
    resetFileInput();
    return;
}

if (selectedStore && uniqueStores[0] !== selectedStore) {
    showToast("File Store Code does not match selected Store", "error");
    parsedData = [];
    hasValidationError = true;
    resetFileInput();
    return;
}

const invalidRow = parsedData.find((row, index) => {
    const qty = Number(row.Qty);

    if (!row.StoreCode || !row.SaleDate || !row.SKU || !row.Qty) {
        showToast("Missing required fields", "error");
        hasValidationError = true;
        resetFileInput();
        return true;
    }

    if (isNaN(qty) || qty <= 0) {
        showToast("Qty must be greater than 0", "error");
        hasValidationError = true;
        resetFileInput();
        return true;
    }

    return false;
});

if (invalidRow) {
    parsedData = [];
    return;
}

    showToast("File parsed successfully", "success");
};

if (fileExt === 'csv') {
    reader.readAsText(file);
} else {
    reader.readAsArrayBuffer(file);
}

}

function handleDrop(event) {
    event.preventDefault();
    const zone = document.getElementById('dropZone');
    zone.style.borderColor = 'var(--slds-n7)';
    zone.style.backgroundColor = 'var(--slds-n10)';

    const files = event.dataTransfer.files;
    if (files.length > 0) {
        handleFile(files); 
    }
}

function downloadUploadedFile() {
    const headers = ['Store Code', 'Store Name', 'Sale Date', 'Item SKU', 'Item Description', 'Qty', 'Unit Price', 'Total Price'];
    
    // Sample data matching your image format
    const sampleData = [
        ['STR001', 'DM', '46167', 'IU5011-M', 'IU5011-M', 5, 150, 750],
        ['STR001', 'DM', '46168', 'IS4937-140', 'IS4937-140', 2, 200, 400],
        ['STR001', 'ME', '46168', 'SKU98765', 'SKU98765', 2, 1100, 2200],
        ['STR001', 'ME', '46170', 'IS4937-140', 'IS4937-140', 1, 200, 200],
        ['STR001', 'AUH', '46167', 'HP3206-9', 'HP3206-9', 4, 500, 2000],
        ['STR001', 'AUH', '46168', 'IU5011-M', 'IU5011-M', 3, 150, 450]
    ];
    
    // Download as Excel (XLSX)
    const wsData = [headers, ...sampleData];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Upload Template');
    
    // Auto-size columns
    ws['!cols'] = headers.map(() => ({ wch: 15 }));
    
    XLSX.writeFile(wb, 'upload_template.xlsx');
    showToast("Excel template downloaded successfully", "success");
}

function submitData() {

    const name = document.getElementById("uploadName").value.trim();
    const type = document.querySelector('input[name="orderType"]:checked')?.value;
    const store = document.getElementById("storeSelect").value;

    if (!name) {
        showToast("Upload Name is mandatory", "error");
        return;
    }
    if (!type) {
        showToast("Please select a Transaction Type", "error");
        return;
    }
    if (!store) {
        showToast("Please select a Store", "error");
        return;
    }

    if (hasValidationError) {
        showToast("Please fix validation errors before submitting", "error");
        return;
    }

    if (parsedData.length === 0) {
        showToast("Please upload a CSV or XLSX file before submitting", "error");
        return;
    }  

    const refNo = "TXN-" + Date.now();

    const rowsWithRef = parsedData.map(r => ({
        ...r,
        REF: refNo
    }));

    const hasError = parsedData.some(row => {
    return !row.StoreCode || !row.SKU || Number(row.Qty) <= 0 || !row.UnitPrice;
});
    const transaction = {
        REF: refNo,
        uploadName: name,
        type: type,
        store: store,
        lines: parsedData.length,
        status: hasError ? "ERROR":"UPLOADED",
        uploadedAt: new Date().toISOString()
    };

    let transactions = JSON.parse(localStorage.getItem("transactions")) || [];
    let allRows = JSON.parse(localStorage.getItem("uploadedData")) || [];

    transactions.push(transaction);
    allRows.push(...rowsWithRef);

    localStorage.setItem("transactions", JSON.stringify(transactions));
    localStorage.setItem("uploadedData", JSON.stringify(allRows));

    showToast(`${refNo} created successfully!`, "success");

    document.getElementById("uploadName").value = "Weekly batch - STR01";
    const radioButtons = document.querySelectorAll('input[name="orderType"]');
    radioButtons.forEach(radio => radio.checked = false);
    document.getElementById("storeSelect").value = "";
    
    const textarea = document.querySelector('.slds-textarea');
    if (textarea) {
        textarea.value = "";
    }

    parsedData = [];

    document.getElementById("fInp").value = "";
    document.getElementById("fileNameText").innerHTML = `Drag & drop files here or <span class="slds-text-link" style="text-decoration: underline;">browse</span>`;

    
}

</script>
</body>
</html>
